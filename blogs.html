  <meta name="description" content="Writing by Linbo Liu.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="Blogs - Linbo Liu">
  <meta property="og:description" content="Writing by Linbo Liu.">
  <meta property="og:image" content="https://linbo-liu.github.io/assets/portrait.jpg">

  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Blogs - Linbo Liu">

  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="stylesheet" type="text/css" href="shared-styles.css">
  <link rel="icon" type="image/jpeg" href="assets/portrait.jpg">
  <style>
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
      text-align: left;
    }

    #blog-posts-list {
      list-style: none !important;
      padding-left: 0 !important;
    }

    .blog-list-item {
      margin-bottom: 24px !important;
      padding-bottom: 18px !important;
      border-bottom: 1px solid #e5e7eb;
    }

    .blog-list-item:last-child {
      border-bottom: 0;
    }

    .blog-list-item h2 {
      font-size: 18px;
      margin: 0 0 6px;
      line-height: 1.35;
    }

    .blog-date {
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .blog-list-item p {
      margin: 0 !important;
      color: #374151;
      line-height: 1.6;
    }

    [data-theme="dark"] .page-title {
      color: var(--text-color);
    }

    [data-theme="dark"] .blog-list-item {
      border-bottom-color: #374151;
    }

    [data-theme="dark"] .blog-list-item p {
      color: var(--text-color);
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main id="main-content" class="main-content-wrapper page-shell">
    <h1 class="page-title">Blogs</h1>
    <ul id="blog-posts-list"></ul>
  </main>

  <div id="site-footer"></div>

  <script src="site-shell.js"></script>
  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>

</html>
